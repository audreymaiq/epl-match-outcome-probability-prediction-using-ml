# ═══════════════════════════════════════════════════════════════════════════════
# Premier League Match Outcome Probability Prediction - Root Compose
# Orchestrates: postgres, api, frontend, on-demand pipelines and monitoring
#
# Usage:
#   docker compose up -d               → start all core services
#   docker compose --profile pipeline run pipeline  → run ELT once
#   docker compose logs -f api         → tail API logs
# ═══════════════════════════════════════════════════════════════════════════════

# ── Shared environment anchors ────────────────────────────────────────────────
x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  TZ: "UTC"

x-backend-env: &backend-env
  <<: *common-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-epl_db}
  DB_USER: ${DB_USER:-epl_user}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-production}

services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL 17 - primary data store
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: epl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-epl_db}
      POSTGRES_USER: ${DB_USER:-epl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/docker/postgres/migrations/001_add_leagues_external_id.sql:/docker-entrypoint-initdb.d/02-migration-001.sql:ro
      - ./backend/docker/postgres/migrations/002_add_elo_ratings.sql:/docker-entrypoint-initdb.d/03-migration-002.sql:ro
      - ./backend/docker/postgres/migrations/003_add_match_id_to_squad_availability.sql:/docker-entrypoint-initdb.d/04-migration-003.sql:ro
      - ./backend/docker/postgres/migrations/005_reconcile_feature_tables.sql:/docker-entrypoint-initdb.d/05-migration-005.sql:ro
      - ./backend/docker/postgres/migrations/006_reconcile_match_loader.sql:/docker-entrypoint-initdb.d/06-migration-006.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-epl_user} -d ${DB_NAME:-epl_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - epl-network

  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-epl_db}
      PGUSER: ${DB_USER:-epl_user}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-1", "-f", "/migrations/006_reconcile_match_loader.sql"]
    volumes:
      - ./backend/docker/postgres/migrations/006_reconcile_match_loader.sql:/migrations/006_reconcile_match_loader.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - epl-network

  # ─────────────────────────────────────────────────────────────────────────
  # FastAPI Prediction API
  # ─────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.api
    container_name: epl-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      MODEL_PATH: ${MODEL_PATH:-/app/models/ensemble_model.pkl}
      WEB_CONCURRENCY: ${API_WORKERS:-1}
      ENABLE_METRICS: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./backend/models:/app/models:ro
      - ./backend/logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - epl-network

  # ─────────────────────────────────────────────────────────────────────────
  # ELT Pipeline runner (profile: pipeline - run once on demand)
  # docker compose --profile pipeline run --rm pipeline
  # ─────────────────────────────────────────────────────────────────────────
  pipeline:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.pipeline
    container_name: epl-pipeline
    restart: "no"
    environment:
      <<: *backend-env
      SOFASCORE_EPL_ID: ${SOFASCORE_EPL_ID:-17}
      PROVIDER: ${PROVIDER:-sofascore}
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - epl-network
    profiles:
      - pipeline

  features:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.pipeline
    restart: "no"
    command: ["python", "-m", "ml.features.batch.orchestrator"]
    environment:
      <<: *backend-env
      ML_CONFIG_PATH: ${ML_CONFIG_PATH:-/app/ml/config/default.json}
    volumes:
      - ./backend/ml/config:/app/ml/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - epl-network
    profiles:
      - pipeline

  train:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.pipeline
    restart: "no"
    command: ["python", "-m", "ml.training.train"]
    environment:
      <<: *backend-env
      ML_CONFIG_PATH: ${ML_CONFIG_PATH:-/app/ml/config/default.json}
    volumes:
      - ./backend/models:/app/models
      - ./backend/ml/config:/app/ml/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - epl-network
    profiles:
      - training

  # ─────────────────────────────────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    container_name: epl-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - epl-network

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus - metrics scraping
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: epl-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - epl-network

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana - dashboards
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.3
    container_name: epl-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - epl-network

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  epl-network:
    driver: bridge
    name: epl-network

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes (survive container restarts)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: epl-postgres-data
  prometheus_data:
    name: epl-prometheus-data
  grafana_data:
    name: epl-grafana-data
