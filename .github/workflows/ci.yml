name: Validate application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation_ci_only
          POSTGRES_DB: football_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U validation -d football_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://validation:validation_ci_only@127.0.0.1:5432/football_test
      TEST_DATABASE_URL: postgresql+psycopg2://validation:validation_ci_only@127.0.0.1:5432/football_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-ml.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check --select E9,F821,F822,F823 api config elt_pipeline ml operations providers utils football.py
      - run: python -m football migrate
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm audit --omit=dev --audit-level=high
