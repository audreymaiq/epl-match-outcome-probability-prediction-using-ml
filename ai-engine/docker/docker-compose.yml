# ai-engine\docker\docker-compose.yml

version: '3.8'

services:
  postgres_db:
    image: postgres:latest
    container_name: footbal_match_predict 
    restart: unless-stopped
    
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plpredict2025} 
      POSTGRES_USER: ${DB_USER:-PLpredict} 
      POSTGRES_DB: ${DB_NAME:-premier_league} 
    
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data:
    driver: local